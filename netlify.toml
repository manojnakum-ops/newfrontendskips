[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"
  NODE_OPTIONS = "--max-old-space-size=4096 --no-experimental-webstorage"
  GENERATE_SOURCEMAP = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  # Keep compiler warnings visible without failing the deployment.
  CI = "false"
